# PhoneDesktop (no root) device configuration, sourced by every pdn-* script.
# Everything runs as Android's "shell" user (uid 2000: ADB, or SSH through Shizuku) under
# proot, which fakes root and the Ubuntu file layout in user space. No mounts, no su.
PD=/data/local/tmp/pdnr               # everything lives here (owned by shell)
R=$PD/rootfs                          # Ubuntu root filesystem
PROOT=$PD/bin/proot                   # static arm64 proot (Termux fork)
PD_USER=kde                           # desktop user inside Ubuntu (a proot-virtual uid)
PD_UID=1000
PD_RES=1920x1080                      # virtual screen size
# X display number. X sockets are abstract (one namespace for the whole phone), so this
# must differ from the root PhoneDesktop's :1 in case both are installed.
PD_DISPLAY=2
PD_RDPORT=21118                       # RustDesk direct-IP port
PD_DNS="1.1.1.1 8.8.8.8"              # resolvers written to /etc/resolv.conf
PD_PROFILE=standard                   # minimal | standard | full  (KDE package set)
if [ -f $PD/pd.local.conf ]; then . $PD/pd.local.conf; fi
export PROOT_TMP_DIR=$PD/tmp          # proot's loader copies live here
# Marker every process of ours carries in its environment (pdn-stop.sh also checks the
# executable path, which is the reliable test).
PD_MARK=PD_NOROOT=1
