# PhoneDesktop device configuration (sourced by every pd-* script).
# deploy.bat / the plugin write overrides into pd.local.conf, which is sourced afterwards.
#
# Two modes, picked by who runs the scripts:
#   root   (uid 0, Magisk su -mm)   Ubuntu in a real chroot under /data/local/phonedesktop
#   proot  (adb shell user, no root) Ubuntu under proot (a userspace chroot via ptrace; Termux's
#          build: --link2symlink for dpkg's hard links) under
#          /data/local/tmp/pdesk. Slower, no mounts, nothing outside that folder is touched.
if [ "$(id -u)" = 0 ]; then
  PD_MODE=root
  PD=/data/local/phonedesktop        # everything lives here (root-owned)
else
  PD_MODE=proot
  PD=/data/local/tmp/pdesk           # shell-owned: the adb shell user can't write elsewhere
fi
export PD_MODE
R=$PD/rootfs                         # Ubuntu root filesystem
PD_USER=kde                          # desktop user inside Ubuntu
# Desktop user's uid.
# root mode - rules (both learned the hard way):
#  - not a uid any Android process uses: the chroot shares Android's process list
#    (uid 1000 = Android "system"; a kill-by-uid took down system_server)
#  - inside Android user 0 and below 10000: Android only routes VPN replies for
#    user-0 uids (4000000 = "user 40" was unreachable over the VPN), and uids
#    below 10000 are exempt from the Doze / battery-saver firewall
#  5999 is in AOSP's OEM-reserved block 5000-5999; pd-chroot-setup refuses to use
#  it if an Android process already runs with it.
# proot mode: everything really runs as the shell user, so the desktop user IS uid 2000
#  (a faked uid would break D-Bus and PulseAudio, which check real peer credentials).
PD_UID=5999
PD_RES=1920x1080                     # virtual screen size
PD_DISPLAY=1                         # X display number (:1)
PD_DNS="1.1.1.1 8.8.8.8"             # resolvers written to /etc/resolv.conf
PD_PROFILE=standard                  # minimal | standard | full  (KDE package set)
BB=/data/adb/magisk/busybox          # Magisk busybox (root mode: tar, mount --make-*)
if [ -f $PD/pd.local.conf ]; then . $PD/pd.local.conf; fi
if [ $PD_MODE = proot ]; then PD_UID=2000; TAR=/system/bin/tar; else TAR="$BB tar"; fi

# Run a command inside Ubuntu:
#   pd_in CMD...        root mode: as root in the chroot;  proot mode: as fake root
#   pd_in_user CMD...   proot mode: as the real user (= the desktop user); root mode: as root
PROOT_ARGS="-l -r $R -b /dev -b /proc -b /sys -b /proc/self/fd:/dev/fd -b $R/tmp:/dev/shm \
 -b /storage/emulated/0:/mnt/sdcard -w /"
pd_proot_env() { export LD_LIBRARY_PATH=$PD/bin PROOT_LOADER=$PD/bin/loader PROOT_TMP_DIR=$PD/tmp; }
pd_proot() { # proot-options... -- cmd...
  local opts=""
  while [ "$1" != "--" ]; do opts="$opts $1"; shift; done; shift
  ( pd_proot_env; exec $PD/bin/proot $opts $PROOT_ARGS "$@" )
}
pd_in() {
  if [ $PD_MODE = root ]; then chroot "$R" "$@"; else pd_proot -0 --kill-on-exit -- "$@"; fi
}
pd_in_user() {
  if [ $PD_MODE = root ]; then chroot "$R" "$@"; else pd_proot --kill-on-exit -- "$@"; fi
}
# proot mode: the long-running proot that supervises the desktop, and what it traces
pd_super() { # -> pid of the running supervisor, if any
  local p; p=$(cat $PD/desktop.pid 2>/dev/null)
  [ -n "$p" ] && tr '\0' ' ' < /proc/$p/cmdline 2>/dev/null | grep -q "$PD/bin/proot" && echo "$p"
}
pd_sysd() { # -> pid of the running fake-root service starter (pd-sysd), if any
  local p; p=$(cat $PD/sysd.pid 2>/dev/null)
  [ -n "$p" ] && tr '\0' ' ' < /proc/$p/cmdline 2>/dev/null | grep -q "$PD/bin/proot" && echo "$p"
}
pd_tracees() { # pids traced by supervisor $1 - exactly the desktop's processes, nothing else
  [ -n "$1" ] || return 0
  grep -l "^TracerPid:[[:space:]]*$1\$" /proc/[0-9]*/status 2>/dev/null | sed 's|/proc/\([0-9]*\)/status|\1|'
}
pd_running() { # is anything running inside Ubuntu?
  if [ $PD_MODE = root ]; then ls -l /proc/[0-9]*/root 2>/dev/null | grep -q " -> $R\$"
  else [ -n "$(pd_super)" ]; fi
}
